<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso · {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/admin.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand-mark">I</div>
      <h1>Motor de Curaduría</h1>
      <p class="sub">Acceso administrativo · INALDE</p>

      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/admin/login">
        <div class="field" style="margin-bottom:16px;">
          <label class="label-x" for="username">Usuario</label>
          <input class="input-x" id="username" name="username" type="text"
                 value="{{ username or '' }}" autocomplete="username" required autofocus />
        </div>
        <div class="field" style="margin-bottom:22px;">
          <label class="label-x" for="password">Contraseña</label>
          <input class="input-x" id="password" name="password" type="password"
                 autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-rojo" style="width:100%; justify-content:center;">
          Ingresar
        </button>
      </form>
    </div>
  </div>
</body>
</html>
